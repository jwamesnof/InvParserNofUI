# .github/workflows/ui-testing.yaml
name: Playwright UI Tests

on:
  pull_request:
    branches:
      - main

jobs:
  playwright-matrix-tests:
    runs-on: ubuntu-22.04   # ✅ FIX 1: pin OS

    strategy:
      matrix:
        browser: [chromium, firefox]   # ✅ FIX 2: valid Playwright browsers
        resolution:
          - { name: 'desktop', width: 1920, height: 1080 }
          - { name: 'tablet', width: 768, height: 1024 }
          - { name: 'mobile', width: 375, height: 667 }
      fail-fast: false

    name: Test ${{ matrix.browser }} - ${{ matrix.resolution.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
            fetch-depth: 1  # Fetch only the latest commit to speed up the checkout process
            repository: jwamesnof/InvParserNofUI  # Replace with your UI testing repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ✅ FIX 3: install Playwright + system deps correctly
      - name: Install Playwright browsers
        run: |
          playwright install --with-deps

      - name: Run Playwright tests
        env:
          HEADLESS: true
          BROWSER: ${{ matrix.browser }}
          SCREEN_WIDTH: ${{ matrix.resolution.width }}
          SCREEN_HEIGHT: ${{ matrix.resolution.height }}
          APP_URL: https://uncorpulently-subovate-emil.ngrok-free.dev
          TEST_NAME: ${{ matrix.browser }}-${{ matrix.resolution.name }}
        run: |
          pytest test/ -v

      - name: Archive test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots-${{ matrix.browser }}-${{ matrix.resolution.name }}
          path: |
            test/*.png
            test/**/*.png

    