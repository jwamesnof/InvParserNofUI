<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2e7fd9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4a9fe5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1ab89a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5eb3f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4aa;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Document with border -->
  <rect x="50" y="60" width="140" height="180" rx="15" fill="url(#docGrad)" stroke="#1a5399" stroke-width="3"/>
  
  <!-- Document text lines -->
  <line x1="70" y1="90" x2="130" y2="90" stroke="#87ceeb" stroke-width="4" stroke-linecap="round"/>
  <line x1="70" y1="110" x2="160" y2="110" stroke="#87ceeb" stroke-width="4" stroke-linecap="round"/>
  <line x1="70" y1="130" x2="160" y2="130" stroke="#87ceeb" stroke-width="4" stroke-linecap="round"/>
  <line x1="70" y1="150" x2="140" y2="150" stroke="#87ceeb" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Wavy bottom -->
  <path d="M 50 220 Q 62 235 74 220 T 98 220 T 122 220 T 146 220 T 170 220 T 182 220 T 190 230 L 190 230" 
        fill="none" stroke="#1ab89a" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Magnifying glass circle (large) -->
  <circle cx="155" cy="165" r="85" fill="none" stroke="#1ab89a" stroke-width="6"/>
  
  <!-- Magnifying glass circle (inner) -->
  <circle cx="155" cy="165" r="75" fill="none" stroke="#1ab89a" stroke-width="3" opacity="0.5"/>
  
  <!-- Magnifying glass handle -->
  <line x1="220" y1="230" x2="280" y2="290" stroke="#1ab89a" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Dollar sign in magnifying glass -->
  <text x="155" y="175" font-size="70" font-weight="bold" fill="#00d4aa" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif">$</text>
  
  <!-- AI Badge -->
  <rect x="165" y="45" width="65" height="65" rx="12" fill="url(#aiGrad)" stroke="#1a5399" stroke-width="3"/>
  <text x="197.5" y="83" font-size="40" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif">AI</text>
  
  <!-- Sparkles around AI badge -->
  <circle cx="180" cy="25" r="4" fill="#ffd54f"/>
  <circle cx="220" cy="30" r="3" fill="#ffd54f"/>
  <circle cx="145" cy="35" r="3" fill="#b3e5fc"/>
  <circle cx="235" cy="75" r="3.5" fill="#c8e6c9"/>
</svg>
